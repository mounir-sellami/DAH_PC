<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<title>Carte de la Tunisie</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  :root{--g:#4b6a3a;--gd:#3a5330;--gold:#d9a82e;--cream:#fbf8ef}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",system-ui,Arial,sans-serif;color:#222}
  body{background:var(--cream);overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;z-index:2000;background:linear-gradient(180deg,var(--g),var(--gd));color:#fff;padding:8px 20px 10px;border-bottom:4px dashed var(--gold)}
  .top{display:flex;align-items:flex-start;gap:16px;direction:ltr}
  .logo{width:78px;height:60px;border:3px solid #fff;border-radius:10px;overflow:hidden;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0005}
  .logoc{display:block;height:86px;width:auto;margin:0;flex:none;filter:drop-shadow(0 1px 3px #0006)}
  .tl{display:flex;align-items:flex-start;flex-wrap:wrap;gap:6px 44px;margin:0 0 4px}.tl h1{align-self:center}
  .logo svg,.logo img{width:100%;height:100%;object-fit:contain}#logoL img{object-fit:cover}
  #logoR{width:64px;height:60px}
  .ttl{flex:1;min-width:0}
  html[dir=rtl] .ttl{direction:rtl;text-align:right}
  .ttl h1{margin:0;font-size:24px}
  .ttl p{margin:2px 0;font-size:13px;font-weight:600;opacity:.95}.ttl p.s{font-weight:400;opacity:.85}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
  .pill{border:1px solid #ffffff55;background:#ffffff1a;border-radius:20px;padding:6px 14px;font-size:13px;white-space:nowrap}
  .pill b{font-size:15px;margin-inline-start:4px}
  header select,header input[type=text]{border:1px solid #ffffff55;background:#ffffff1a;color:#fff;border-radius:20px;padding:7px 12px;font-size:13px;min-width:150px;font-family:inherit}
  header select.sm{min-width:0;padding:7px 8px}
  header select option{color:#222}header input::placeholder{color:#ffffffbb}
  header select:disabled{opacity:.5}
  .lang{display:inline-flex;gap:8px;direction:ltr}
  .lang button{border:1px solid #ffffff66;background:#ffffff1f;border-radius:20px;padding:5px 12px;cursor:pointer;display:flex;align-items:center;line-height:0}
  .lang button svg{width:28px;height:20px;border-radius:3px;box-shadow:0 0 0 1px #0003;display:block}
  .lang button:hover{background:#ffffff40}
  .lang button.on{background:var(--gold);border-color:#fff;box-shadow:0 0 0 2px #ffffff88}
  .pgopt{display:inline-flex;gap:4px;align-items:center}
  .rbreak{flex:0 0 100%;height:0}
  .chk{font-size:13px;cursor:pointer;white-space:nowrap;gap:6px}
  .btn{border:0;border-radius:24px;padding:9px 18px;font-weight:700;font-size:13px;cursor:pointer;background:linear-gradient(180deg,#f0c04a,var(--gold));color:#3b2d00;box-shadow:0 3px 0 #a67f14;font-family:inherit}
  .btn:disabled{opacity:.6}
  .bar{position:fixed;left:0;right:0;z-index:1999;display:flex;align-items:center;gap:14px;background:#fff;padding:0 20px;border-bottom:1px solid #ddd;min-height:44px}
  .tab{padding:12px 4px;font-weight:700;font-size:14px;color:var(--g);border-bottom:3px solid var(--g)}
  #status{flex:1;color:#555;font-size:12px}
  .cr{font-size:11px;color:#2a4d9b;text-align:end;line-height:1.3}
  main{position:fixed;left:0;right:0;top:220px;bottom:56px;display:flex;min-height:0}
  #map{flex:1;position:relative;min-width:0;direction:ltr}
  .box{position:absolute;z-index:1000;left:10px;top:100px;background:#fff;border-radius:6px;box-shadow:0 1px 6px #0005;padding:8px 12px;font-size:14px;max-width:260px}
  html[dir=rtl] .box{direction:rtl}
  .box label{display:block;margin:5px 0;cursor:pointer}.box hr{border:0;border-top:1px solid #ddd;margin:6px 0}
  #side{width:270px;background:#fff;border-left:1px solid #ddd;display:flex;flex-direction:column;--fs:13px}
  html[dir=rtl] main{direction:ltr}
  html[dir=rtl] #side{direction:rtl}
  .tools{display:flex;gap:6px;justify-content:flex-end;padding:8px;direction:ltr}
  .tools button{border:1px solid #cfd8c8;background:#f1f6ee;border-radius:8px;padding:4px 10px;font-weight:700;cursor:pointer}
  #govList{overflow:auto;flex:1;padding:4px 14px;font-size:var(--fs)}
  .it{display:flex;align-items:center;gap:8px;padding:5px 2px;cursor:pointer;border-radius:6px}.it:hover{background:#eef4ea}
  .dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid #0003}
  footer{position:fixed;left:0;right:0;bottom:0;z-index:2000;background:#fffdf6;border-top:4px dashed var(--gold);padding:8px 12px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:12px}
  .fp{display:flex;align-items:center;gap:8px;border:1px solid #e2dcc3;background:#fff;border-radius:22px;padding:5px 14px;color:#333;text-decoration:none}
  .fp b{color:#2a4d9b}.fp svg{width:20px;height:20px;flex:none}
  .av{width:32px;height:32px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center}.av svg{width:18px;height:18px}
  .pi{border-collapse:collapse;font-size:12px;margin:4px 0}.pi td{padding:2px 6px 2px 0;vertical-align:top}[dir=rtl] .pi td{padding:2px 0 2px 6px}.pi td:first-child{color:#666;white-space:nowrap}
  .pop h3{margin:0 0 4px;font-size:14px}.pop img{width:100%;max-height:170px;object-fit:cover;border-radius:6px;margin:4px 0}.pop p{margin:4px 0;font-size:12px;line-height:1.35}.pop small{color:#777}
  html[dir=rtl] .leaflet-popup-content,html[dir=rtl] .leaflet-tooltip{direction:rtl;text-align:right}
  .lbl{background:none;border:none;box-shadow:none;font-weight:600;font-size:11px;color:#222;text-shadow:0 0 3px #fff,0 0 3px #fff;text-align:center;white-space:nowrap}
  .leaflet-tooltip.htip{font-weight:600}
  body.hh .leaflet-tooltip:not(.htip){display:none}

  /* ===== Feuille d'impression (masquée à l'écran) ===== */
  #sheetHead,#sheetFoot,#legendBox,#northBox{display:none}
  body.pm{--pw:281mm;--ph:193mm;--k:1;--hh:calc(20mm*var(--k));--fh:calc(12mm*var(--k));overflow:hidden;background:#fff}
  body.pm header,body.pm .bar,body.pm footer,body.pm #side,body.pm .box,
  body.pm .leaflet-control-zoom,body.pm .leaflet-control-attribution,body.pm .leaflet-popup,body.pm .leaflet-tooltip{display:none!important}
  body.pm #map{position:fixed;left:0;top:calc(var(--hh) + 2.5mm);width:var(--pw);height:calc(var(--ph) - var(--hh) - var(--fh) - 5mm);flex:none;border:.3mm solid #2b3a24;background:#fff}
  body.pm #sheetHead{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);position:fixed;z-index:3000;left:0;top:0;width:var(--pw);height:var(--hh);align-items:center;column-gap:calc(5mm*var(--k));padding-bottom:calc(1.5mm*var(--k));border-bottom:.8mm solid var(--g);direction:ltr;background:#fff}
  body.pm #sheetHead::after{content:"";position:absolute;left:0;right:0;bottom:-1.7mm;border-top:.35mm dashed var(--gold)}
  .shl{height:calc(15mm*var(--k));max-width:calc(26mm*var(--k));object-fit:contain;flex:none}
  .shL{grid-column:1;display:flex;align-items:center;gap:calc(5mm*var(--k));min-width:0}
  .shR{grid-column:3;display:flex;justify-content:flex-end}
  #shLogoC{grid-column:2;height:calc(18mm*var(--k));max-width:calc(30mm*var(--k))}
  .shm{flex:1;min-width:0;text-align:center}
  .shm h1{margin:0;font-size:calc(17pt*var(--k));line-height:1.15;color:var(--gd);letter-spacing:.2px}
  .shm p{margin:calc(.6mm*var(--k)) 0 0;font-size:calc(8.5pt*var(--k));color:#555}
  .shm p.zn{font-size:calc(10.5pt*var(--k));font-weight:700;color:#222}
  body.pm #sheetFoot{display:flex;flex-direction:column;justify-content:center;gap:calc(.9mm*var(--k));position:fixed;z-index:3000;left:0;top:calc(var(--ph) - var(--fh));width:var(--pw);height:var(--fh);border-top:.25mm solid #999;font-size:calc(7pt*var(--k));color:#444;background:#fff}
  #sheetFoot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  #sheetFoot .fr{display:flex;justify-content:space-between;gap:calc(6mm*var(--k));min-width:0}#sheetFoot .fr>span:first-child{flex:1 1 auto}#sheetFoot .fr>span:last-child{flex:0 1 auto;text-align:end}#sheetFoot #sfL{font-weight:600;color:#2a3a22}
  body.pm #legendBox{display:block;position:absolute;right:3mm;bottom:3mm;z-index:1000;background:#fffffff2;border:.25mm solid #444;border-radius:1mm;padding:calc(1.8mm*var(--k)) calc(3mm*var(--k));font-size:calc(8pt*var(--k));line-height:1.45;min-width:calc(40mm*var(--k));pointer-events:none}
  #legendBox .lt{font-weight:700;border-bottom:.2mm solid #999;margin-bottom:1mm;padding-bottom:.6mm}
  #legendBox .lg{display:flex;align-items:center;gap:2mm}
  #legendBox i{display:inline-block;flex:none;width:calc(6mm*var(--k));height:calc(3mm*var(--k))}
  body.pm #northBox{display:block;position:absolute;right:3mm;top:3mm;z-index:1000;width:calc(9mm*var(--k));pointer-events:none}
  #northBox svg{width:100%;display:block}
  body.pm .leaflet-control-scale{margin-left:3mm;margin-bottom:3mm}
  body.pm .leaflet-control-scale-line{font-size:calc(8pt*var(--k));background:#fffffff2;border-color:#222;color:#222}

  .stabs{display:flex;border-bottom:1px solid #ddd}
  .stabs button{flex:1;border:0;border-bottom:3px solid transparent;background:#f1f6ee;color:var(--gd);padding:9px 4px;font:700 12px inherit;font-family:inherit;cursor:pointer}
  .stabs button.on{background:#fff;border-bottom-color:var(--g)}
  #hydPanel{display:none;flex:1;min-height:0;flex-direction:column}
  #side.th #hydPanel{display:flex}#side.th #govList{display:none}
  #hSearch{margin:8px 10px 4px;border:1px solid #cfd8c8;border-radius:16px;padding:6px 12px;font-size:12px;font-family:inherit;min-width:0}
  #hCount{padding:0 14px 4px;font-size:11px;color:#666}
  #hydLive{overflow:auto;flex:1;padding:2px 8px;font-size:var(--fs)}
  .hit{padding:5px 8px;border-radius:6px;cursor:pointer;border-inline-start:3px solid transparent}
  .hit:hover{background:#fff3e0;border-inline-start-color:#ff6a00}
  .hit b{display:block;font-weight:600}.hit small{color:#666;font-size:.85em}
  .hmsg{padding:12px;color:#666;font-size:12px}
  /* ===== Numérotation sur la carte + liste des cours et plans d'eau ===== */
  .hnw{background:none;border:none}
  .hnum{position:absolute;left:0;top:0;transform:translate(-50%,-50%);min-width:15px;height:15px;padding:0 3px;box-sizing:border-box;border-radius:8px;background:#fff;border:1.5px solid #c0392b;color:#c0392b;font:700 9px/12px Arial,sans-serif;text-align:center;white-space:nowrap;box-shadow:0 0 0 1px #fffc}
  #hydSp,#hydList{display:none}
  #hydList h2{margin:0 0 calc(3mm*var(--k,1));font-size:calc(13pt*var(--k,1));color:var(--gd);border-bottom:.6mm solid var(--g);padding-bottom:1.5mm;line-height:1.25}
  #hydList .hc{column-count:2;column-gap:8mm;font-size:calc(9pt*var(--k,1))}
  #hydList .hr{display:flex;align-items:flex-start;gap:2.5mm;padding:.9mm 0;border-bottom:.15mm solid #ddd;break-inside:avoid}
  #hydList .hb{flex:none;min-width:calc(6.5mm*var(--k,1));height:calc(4.6mm*var(--k,1));padding:0 1mm;box-sizing:border-box;border-radius:3mm;border:.4mm solid #c0392b;color:#c0392b;font-weight:700;font-size:.85em;line-height:calc(4.1mm*var(--k,1));text-align:center}
  #hydList .hm{min-width:0}#hydList .hm b{display:block}#hydList .hm small{color:#555;font-size:.85em}
  #hydList .hf{margin-top:4mm;font-size:.8em;color:#666;border-top:.25mm solid #999;padding-top:1.5mm}
  @media print{
    html.pl,html.pl body{overflow:visible!important;height:auto!important}
    body.pm.pl main{position:static!important;display:block;height:0;min-height:0}
    body.pm.pl #map,body.pm.pl #sheetHead,body.pm.pl #sheetFoot{position:absolute}
    body.pm.pl #hydSp{display:block;height:1px}
    body.pm.pl #hydList{display:block;break-before:page;page-break-before:always}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    html,body{height:auto;overflow:hidden}
    header,.bar,footer,#side,.box,.leaflet-control-zoom,.leaflet-popup{display:none!important}
    body:not(.pm) #map{position:fixed;left:0;top:0;right:0;bottom:0}
  }
  .sidebtn{display:none;border:1px solid #cfd8c8;background:#f1f6ee;color:var(--gd);border-radius:18px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
  @media(max-width:900px){.sidebtn{display:inline-block}#side{display:none}
    body.side-open #side{display:flex;position:absolute;top:0;bottom:0;right:0;z-index:1100;width:min(280px,82vw);box-shadow:-4px 0 14px #0004}.ttl h1{font-size:18px}.logo{width:56px;height:44px}.logoc{height:58px;margin:0}.tl{gap:4px 24px}#logoR{width:48px;height:48px}.box{top:70px}}
</style>
<style id="pg">@page{size:A4 landscape;margin:8mm}</style>
</head>
<body>
<header id="hd">
  <div class="top">
    <div class="logo" id="logoL"><svg viewBox="0 0 90 60"><rect width="90" height="60" fill="#e70013"/><circle cx="45" cy="30" r="16" fill="#fff"/><circle cx="44" cy="30" r="12.2" fill="#e70013"/><circle cx="47.4" cy="30" r="9.8" fill="#fff"/><polygon points="47.60,24.40 48.95,28.14 52.93,28.27 49.79,30.71 50.89,34.53 47.60,32.30 44.31,34.53 45.41,30.71 42.27,28.27 46.25,28.14" fill="#e70013"/></svg></div>
    <div class="ttl">
      <div class="tl"><h1 id="hTitle"></h1><img class="logoc" id="logoC" alt=""></div>
      <p id="hRep"></p>
      <p class="s" id="hSub"></p>
    </div>
    <div class="logo" id="logoR"><svg viewBox="0 0 64 64"><defs><radialGradient id="gg" cx=".35" cy=".3"><stop offset="0" stop-color="#7cc0ff"/><stop offset="1" stop-color="#0b4fa3"/></radialGradient></defs><circle cx="32" cy="32" r="29" fill="url(#gg)"/><path d="M13 26c4-9 13-11 17-8s2 8-4 10-8 9-13-2z" fill="#4e9a3a"/><path d="M34 33c6-4 14-2 16 4s-4 14-10 14-10-10-6-18z" fill="#5aa845"/><path d="M39 11c5-2 10 0 11 5-5 1-9 0-11-5z" fill="#5aa845"/><ellipse cx="32" cy="32" rx="12" ry="29" fill="none" stroke="#ffffff80" stroke-width="1"/><path d="M4 32h56M8 18h48M8 46h48" stroke="#ffffff60" fill="none"/><circle cx="32" cy="32" r="29" fill="none" stroke="#fff" stroke-width="2"/></svg></div>
  </div>
  <div class="row">
    <span class="lang" id="langSw"><button data-lang="fr" title="Français" aria-label="Français"><svg viewBox="0 0 3 2"><rect width="1" height="2" fill="#0055a4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ef4135"/></svg></button><button data-lang="en" title="English" aria-label="English"><svg viewBox="0 0 60 30"><clipPath id="ukc"><rect width="60" height="30"/></clipPath><g clip-path="url(#ukc)"><rect width="60" height="30" fill="#012169"/><path d="M0 0L60 30M60 0L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0L60 30M60 0L0 30" stroke="#C8102E" stroke-width="2" clip-path="url(#ukc)"/><path d="M30 0V30M0 15H60" stroke="#fff" stroke-width="10"/><path d="M30 0V30M0 15H60" stroke="#C8102E" stroke-width="6"/></g></svg></button><button data-lang="ar" title="العربية" aria-label="العربية"><svg viewBox="0 0 90 60"><rect width="90" height="60" fill="#e70013"/><circle cx="45" cy="30" r="16.5" fill="#fff"/><circle cx="44" cy="30" r="12.2" fill="#e70013"/><circle cx="47.6" cy="30" r="10" fill="#fff"/><polygon points="47.8,22.8 49.5,27.7 54.6,27.8 50.6,30.9 52.0,35.8 47.8,32.9 43.6,35.8 45.0,30.9 41.0,27.8 46.1,27.7" fill="#e70013"/></svg></button></span>
    <span class="pill"><span data-i18n="pGov"></span> : <b id="cGov">–</b></span>
    <span class="pill"><span data-i18n="pDel"></span> : <b id="cDel">–</b></span>
    <span class="pill"><span data-i18n="pHyd"></span> : <b id="cHydro">0</b></span>
    <select id="goto"><option value="" data-i18n="govPh"></option></select>
    <select id="gotoDel" disabled><option value="" data-i18n="delPh"></option></select>
    <span class="rbreak"></span>
    <input type="text" id="title" data-ph="titlePh">
    <span class="pgopt">
      <select id="pgSize" class="sm"><option value="A4">A4</option><option value="A3">A3</option></select>
      <select id="pgOri" class="sm"><option value="L" data-i18n="oriL"></option><option value="P" data-i18n="oriP"></option></select>
    </span>
    <span class="pgopt">
      <select id="outFmt" class="sm" title="Format"><option value="pdf">PDF</option><option value="jpg">JPG</option><option value="png">PNG</option><option value="tif">TIF</option></select>
      <select id="outDpi" class="sm" title="dpi" hidden><option value="150">150 dpi</option><option value="200">200 dpi</option><option value="300" selected>300 dpi</option></select>
    </span>
    <label class="pgopt chk"><input type="checkbox" id="pList" checked> <span data-i18n="oList"></span></label>
    <button class="btn" id="print"></button>
    <button class="btn" id="xlsx" data-i18n="bXlsx"></button>
  </div>
</header>
<div class="bar"><button class="sidebtn" id="sideBtn">☰ <span data-i18n="lGov"></span></button><span class="tab" data-i18n="tab"></span><span id="status"></span><span class="cr" id="cr"></span></div>
<main>
  <div id="map"></div>
  <div class="box">
    <div id="baseList"></div><hr>
    <label><input type="checkbox" id="gov" checked> <span data-i18n="lGov"></span></label>
    <label><input type="checkbox" id="del"> <span data-i18n="lDel"></span></label>
    <label><input type="checkbox" id="hydro"> <span data-i18n="lHyd"></span></label>
    <label><input type="checkbox" id="names" checked> <span data-i18n="lNames"></span></label>
  </div>
  <aside id="side">
    <div class="stabs"><button id="stG" class="on" data-i18n="lGov"></button><button id="stH" data-i18n="lHyd"></button></div>
    <div class="tools"><button id="fm">A−</button><span id="fp" style="align-self:center;font-size:12px">100%</span><button id="fpl">A+</button><button id="fr">↺</button></div>
    <div id="govList"></div>
    <div id="hydPanel"><input type="text" id="hSearch" data-ph="hSearchPh"><div id="hCount"></div><div id="hydLive"></div></div>
  </aside>
</main>
<footer id="footer"></footer>

<!-- Feuille d'impression -->
<div id="sheetHead">
  <div class="shL"><img class="shl" id="shLogoL" alt="">
  <div class="shm"><h1 id="shTitle"></h1><p id="shSub"></p><p class="zn" id="shZone"></p></div></div>
  <img class="shl" id="shLogoC" alt="">
  <div class="shR"><img class="shl" id="shLogoR" alt=""></div>
</div>
<div id="sheetFoot"><div class="fr"><span id="sfL"></span><span id="sfR"></span></div><div class="fr"><span id="sfD"></span><span id="sfC"></span></div></div>
<div id="legendBox"></div>
<div id="hydSp"></div>
